<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service temporarily unavailable</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f7f9fc;
         color:#16202e; font-family:"Segoe UI",Roboto,Arial,sans-serif; padding:20px; }
  .box { max-width:560px; text-align:center; background:#fff; border:1px solid #d3dae4;
         border-top:5px solid #8c1c1c; border-radius:10px; padding:34px 30px; }
  h1 { font-family:Georgia,serif; font-size:1.5rem; margin:0 0 10px; }
  p { color:#465468; line-height:1.6; margin:0 0 14px; }
  a { display:inline-block; margin-top:8px; background:#123a6d; color:#fff;
      text-decoration:none; padding:10px 20px; border-radius:6px; font-weight:600; }
</style>
</head>
<body>
  <div class="box">
    <h1>The website is temporarily unavailable</h1>
    <p>Something went wrong at our end. The problem has been logged and the office has
       been notified. Please try again in a few minutes.</p>
    <a href="/">Back to the home page</a>
  </div>
</body>
</html>
