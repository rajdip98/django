{% extends 'club/base.html' %}

{% block content %}
<section class="section">
  <div class="wrap" style="max-width:640px">
    <div class="panel">
      <div class="panel-head">Password updated</div>
      <div class="panel-body" style="text-align:center;padding:32px">
        <div style="font-size:2.6rem" aria-hidden="true">✅</div>
        <h1 style="font-size:1.4rem">Your password has been changed</h1>
        <p style="color:var(--ink-soft)">You can now sign in to the member portal with your new password.</p>
        <a class="btn btn-primary" href="{% url 'club:login' %}">Go to login</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
