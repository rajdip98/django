{% extends 'club/base.html' %}

{% block content %}
<section class="section">
  <div class="wrap" style="max-width:640px">
    <div class="panel">
      <div class="panel-head">Reset link sent</div>
      <div class="panel-body" style="text-align:center;padding:32px">
        <div style="font-size:2.6rem" aria-hidden="true">📧</div>
        <h1 style="font-size:1.4rem">Check your inbox</h1>
        <p style="color:var(--ink-soft)">If an account exists for the address you entered, a
          password reset link has been sent. The link is valid for a limited period.</p>
        <a class="btn btn-primary" href="{% url 'club:login' %}">Back to login</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
